<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Cinema | 3D Food &amp; Beverage Menu</title>
    <meta name="description" content="Explore Royal Cinema's full 3D interactive Concessions Menu — Popcorn, Nachos, Combos, Puffs, Brownies &amp; Chilled Drinks delivered to your seat.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;700&family=Galada&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --muted-color: rgba(255, 255, 255, 0.72);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.14);
            --pink-accent: #fbcfe8;
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Galada', cursive;

            /* Dynamic Background Variables */
            --bg-inner: #8a4b0b;
            --bg-mid: #4e2604;
            --bg-outer: #140901;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Bubbles container */
        #bubbles-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble-img {
            position: absolute;
            pointer-events: none;
        }

        @keyframes floatUpImg {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-110vh) translateX(30px) rotate(360deg); opacity: 0; }
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 4%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 120;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            font-weight: 700;
            font-size: 1.35rem;
            font-family: var(--font-heading);
            color: #ffffff;
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 0.35rem;
            background: var(--glass-bg);
            padding: 0.35rem;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            flex-wrap: wrap;
        }

        .nav.glass {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-item {
            font-family: 'Manrope', sans-serif;
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.45rem 0.95rem;
            border-radius: 100px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #fbcfe8;
            color: #011d17;
        }

        .contact-btn {
            background: rgba(0, 0, 0, 0.55);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-btn:hover {
            background: rgba(0, 0, 0, 0.78);
            transform: translateY(-2px);
        }

        .cart-badge {
            background: #fbcfe8;
            color: #011d17;
            border-radius: 999px;
            padding: 0.1rem 0.45rem;
            font-size: 0.72rem;
            font-weight: 800;
        }

        /* Hero */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4%;
            padding-top: 4.5rem;
        }

        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .main-title,
        .side-title {
            font-family: var(--font-heading);
            font-size: clamp(3.6rem, 6.8vw, 7.8rem);
            line-height: 0.9;
            font-weight: 400;
            color: white;
        }

        .side-title {
            font-size: clamp(3rem, 5vw, 5.8rem);
            align-self: flex-end;
            text-align: right;
            white-space: nowrap;
        }

        /* Leaves */
        .leaves-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            transition: transform 0.1s ease-out;
        }

        .leaf {
            position: absolute;
            width: 60px;
            height: 60px;
            pointer-events: none;
            z-index: -1;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
        }

        .l1 { top: 10%; left: 15%; }
        .l2 { top: 40%; left: 80%; width: 140px; height: 140px; opacity: 0.4; }
        .l3 { top: 70%; left: 75%; width: 80px; height: 80px; }
        .l4 { top: 85%; left: 20%; width: 120px; height: 120px; opacity: 0.3; }

        /* Left Column */
        .hero-left {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 4.5rem 0 3.5rem 0;
            gap: 1.25rem;
            z-index: 100;
            max-width: 440px;
        }

        .offer-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            width: fit-content;
            padding: 0.35rem 0.9rem;
            border-radius: 999px;
            background: rgba(251, 207, 232, 0.16);
            border: 1px solid rgba(251, 207, 232, 0.45);
            color: #fbcfe8;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .description {
            color: var(--muted-color);
            font-size: 1.02rem;
            line-height: 1.55;
            max-width: 390px;
        }

        .price-meta {
            display: flex;
            align-items: baseline;
            gap: 0.85rem;
        }

        .price-tag {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fbcfe8;
        }

        .stock-note {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.65);
        }

        .primary-btn {
            display: flex;
            align-items: center;
            gap: 1.4rem;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.14);
            padding: 0.4rem 0.4rem 0.4rem 1.4rem;
            border-radius: 100px;
            font-weight: 700;
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .primary-btn:hover {
            background: rgba(0, 0, 0, 0.78);
            transform: translateY(-3px);
        }

        .plus-icon {
            background: #fbcfe8;
            color: #011d17;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: 900;
            line-height: 1;
            padding-bottom: 2px;
        }

        .award-badge {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: auto;
        }

        .award-icon {
            width: 46px;
            height: 46px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .award-text { display: flex; flex-direction: column; }
        .award-title { font-size: 0.68rem; letter-spacing: 0.1em; color: var(--muted-color); }
        .award-subtitle { font-size: 0.82rem; font-weight: 600; }

        /* Center Product Stage */
        .hero-center {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            inset: 0;
            z-index: 1;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.2s forwards, float 6s ease-in-out infinite;
            pointer-events: none;
            perspective: 1200px;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        .main-product-3d {
            width: 75vw;
            height: 75vh;
            outline: none;
            --progress-bar-color: transparent;
            --poster-color: transparent;
            z-index: 1;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(20deg);
            pointer-events: none;
            display: none;
        }

        .main-product-3d.active-3d {
            display: block;
            pointer-events: auto;
        }

        /* 3D Interactive Food Showcase Plate for all Popcorn / Nachos / Combos / Puffs */
        .food-stage-3d {
            position: relative;
            width: clamp(270px, 31vw, 430px);
            height: clamp(270px, 31vw, 430px);
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            will-change: transform, filter;
        }

        .food-stage-3d.hidden-3d {
            display: none;
        }

        .food-halo {
            position: absolute;
            inset: -14%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 207, 232, 0.26) 0%, rgba(255, 255, 255, 0.06) 45%, transparent 72%);
            filter: blur(18px);
            pointer-events: none;
        }

        .food-ring {
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.24);
            animation: spinSlow 24s linear infinite;
            pointer-events: none;
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .food-showcase-img {
            width: 82%;
            height: 82%;
            object-fit: cover;
            border-radius: 36% 64% 58% 42% / 44% 38% 62% 56%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 35px 80px rgba(0, 0, 0, 0.65), 0 0 40px rgba(251, 207, 232, 0.18);
            transform: translateZ(40px);
        }

        .food-showcase-img.can-mode {
            width: 96%;
            height: 96%;
            object-fit: contain;
            border-radius: 0;
            border: none;
            box-shadow: none;
            filter: drop-shadow(0 32px 60px rgba(0, 0, 0, 0.72));
        }

        /* Berries */
        .berries-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 110;
            transition: transform 0.1s ease-out;
        }

        .berries-container-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            transition: transform 0.1s ease-out;
        }

        .berry {
            position: absolute;
            width: 120px;
            height: 120px;
            outline: none;
            --progress-bar-color: transparent;
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.42));
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .berry .float-sprite {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }

        .berry .float-glb {
            width: 100%;
            height: 100%;
            outline: none;
            --progress-bar-color: transparent;
            --poster-color: transparent;
            display: none;
            pointer-events: none;
        }

        .berry.is-glb .float-sprite { display: none; }
        .berry.is-glb .float-glb { display: block; }

        .b1 { top: 22%; left: 30%; width: 190px; height: 190px; }
        .b2 { top: 62%; left: 40%; width: 95px; height: 95px; }
        .b3 { top: 28%; left: 60%; width: 210px; height: 210px; }
        .b4 { top: 14%; left: 48%; width: 130px; height: 130px; }
        .b5 { top: 75%; left: 22%; width: 115px; height: 115px; }
        .b6 { top: 46%; left: 72%; width: 165px; height: 165px; }
        .b7 { top: 15%; left: 40%; width: 80px; height: 80px; opacity: 0.7; }
        .b8 { top: 50%; left: 55%; width: 70px; height: 70px; opacity: 0.6; }
        .b9 { top: 80%; left: 35%; width: 75px; height: 75px; opacity: 0.7; }

        /* Right Column & Carousel */
        .hero-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
            height: 100%;
            padding: 4.5rem 0 3.5rem 0;
            z-index: 100;
            width: 470px;
            pointer-events: none;
        }

        .product-carousel {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-end;
            pointer-events: auto;
            width: 100%;
        }

        .carousel-viewport {
            width: 100%;
            overflow-x: auto;
            padding: 3.4rem 0.25rem 0.6rem 0.25rem;
            scrollbar-width: none;
        }

        .carousel-viewport::-webkit-scrollbar {
            display: none;
        }

        .carousel-cards {
            display: flex;
            gap: 0.9rem;
            width: max-content;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 0.85rem;
            padding-top: 3.4rem;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 128px;
            position: relative;
            backdrop-filter: blur(12px);
            text-align: center;
            flex-shrink: 0;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(255, 255, 255, 0.45);
        }

        .card.active {
            border-color: #fbcfe8;
            background: rgba(251, 207, 232, 0.12);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 84px;
            height: 84px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            margin-top: -5.4rem;
            filter: drop-shadow(0 14px 24px rgba(0, 0, 0, 0.5));
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            display: block;
            pointer-events: none;
        }

        .card:hover img {
            transform: translateY(-16px) rotate(-10deg) scale(1.14) !important;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            font-size: 0.72rem;
            width: 100%;
        }

        .card-info span:first-child {
            font-weight: 700;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info span:last-child {
            color: #fbcfe8;
            font-weight: 700;
        }

        .carousel-controls {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .carousel-counter {
            font-size: 0.78rem;
            color: var(--muted-color);
            font-weight: 600;
        }

        .carousel-nav { display: flex; gap: 0.6rem; }

        .nav-arrow {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .nav-arrow:hover { background: rgba(255, 255, 255, 0.16); }

        /* Seat Order Modal */
        .order-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(1, 14, 12, 0.76);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 1.5rem;
        }

        .order-modal-backdrop.open { display: flex; }

        .order-modal {
            width: 100%;
            max-width: 440px;
            background: rgba(18, 18, 22, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 1.8rem;
            color: #ffffff;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
            max-height: 90vh;
            overflow-y: auto;
        }

        .order-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.1rem;
        }

        .order-modal-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            line-height: 1;
            color: #fbcfe8;
        }

        .close-modal-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
        }

        .cart-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
            max-height: 180px;
            overflow-y: auto;
        }

        .cart-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.6rem 0.8rem;
            font-size: 0.85rem;
        }

        .cart-qty-btns {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .qty-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
        }

        .order-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.9rem;
        }

        .order-field label {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .order-field input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 12px;
            padding: 0.75rem 0.9rem;
            color: #ffffff;
            font-family: var(--font-main);
            font-size: 0.9rem;
            outline: none;
        }

        .order-submit-btn {
            width: 100%;
            margin-top: 0.4rem;
            background: #fbcfe8;
            color: #011d17;
            border: none;
            border-radius: 100px;
            padding: 0.9rem 1.5rem;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .order-status {
            margin-top: 0.85rem;
            font-size: 0.85rem;
            color: #fbcfe8;
            text-align: center;
            min-height: 1.2em;
        }

        @media (max-width: 1200px) {
            body { overflow-y: auto; height: auto; min-height: 100vh; }
            .hero { height: auto; min-height: 100vh; padding-top: 5.5rem; padding-bottom: 2rem; }
            .hero-content { flex-direction: column; align-items: center; text-align: center; gap: 1.5rem; }
            .hero-center { position: relative; height: 320px; order: -1; }
            .main-product-3d { position: relative; top: auto; left: auto; transform: rotate(15deg); width: 280px; height: 280px; }
            .hero-left { align-items: center; padding: 0; max-width: 100%; }
            .award-badge { margin-top: 0.5rem; }
            .hero-right { width: 100%; align-items: center; padding: 0; text-align: center; }
            .side-title { align-self: center; text-align: center; margin-top: 1rem; }
            .nav { display: none; }
        }
    </style>
</head>
<body>
    <div id="bubbles-container"></div>

    <header class="header">
        <a href="/booking" class="logo">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>Royal Concessions</span>
        </a>

        <nav class="nav glass" id="categoryNav">
            <button class="nav-item active" data-cat="ALL">All (15)</button>
            <button class="nav-item" data-cat="COMBOS">Combos</button>
            <button class="nav-item" data-cat="POPCORN">Popcorn</button>
            <button class="nav-item" data-cat="NACHOS">Nachos</button>
            <button class="nav-item" data-cat="PUFFS">Puffs &amp; Sweet</button>
            <button class="nav-item" data-cat="DRINKS">Drinks</button>
            <button class="nav-item" data-cat="OFFERS">Offers</button>
        </nav>

        <button class="contact-btn" id="openOrderModalTop">
            Seat Cart <span class="cart-badge" id="cartCountBadge">0</span>
        </button>
    </header>

    <main class="hero">
        <div class="hero-content">

        const modelViewer = document.querySelector('#product-model');
        const foodStage3d = document.getElementById('foodStage3d');
        const foodStageImg = document.getElementById('foodStageImg');
        const berriesFG = document.querySelector('.berries-container');
        const berriesBG = document.querySelector('.berries-container-bg');
        const leavesBG = document.querySelector('.leaves-container');
        const allBerries = document.querySelectorAll('.berry');
        const carouselCardsEl = document.getElementById('carouselCards');
        const carouselCounterEl = document.getElementById('carouselCounter');

        let filteredItems = [...FOOD_CATALOG];
        let activeItem = FOOD_CATALOG[0];
        let isSwitching = false;
        let switchSpin = 0;
        let cart = [];
        const canTextures = {};
        let isDragging3DCan = false;

        modelViewer.addEventListener('pointerdown', () => { isDragging3DCan = true; });
        window.addEventListener('pointerup', () => { isDragging3DCan = false; });

        async function applyCanTexture(item) {
            if (!item || !item.uvTexture || !modelViewer.model) return;
            try {
                if (!canTextures[item.id]) {
                    canTextures[item.id] = await modelViewer.createTexture(item.uvTexture);
                }
                const tex = canTextures[item.id];
                modelViewer.model.materials.forEach(material => {
                    if (material.pbrMetallicRoughness && material.pbrMetallicRoughness.baseColorTexture) {
                        material.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
                    }
                });
            } catch (e) { console.error('3D texture swap failed:', e); }
        }

        modelViewer.addEventListener('load', async () => {
            for (const it of FOOD_CATALOG) {
                if (it.uvTexture && !canTextures[it.id]) {
                    try { canTextures[it.id] = await modelViewer.createTexture(it.uvTexture); } catch (_) {}
                }
            }
            if (activeItem && activeItem.use3DCan) {
                await applyCanTexture(activeItem);
            }
        });

        function renderCarousel() {
            carouselCardsEl.innerHTML = '';
            filteredItems.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'card' + (item.id === activeItem.id ? ' active' : '');
                card.dataset.id = item.id;
                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}">
                    <div class="card-info">
                        <span>${item.name}</span>
                        <span>₹${item.price}</span>
                    </div>
                `;
                card.addEventListener('click', () => selectItem(item));
                carouselCardsEl.appendChild(card);
            });
            const activeIndex = Math.max(0, filteredItems.findIndex(i => i.id === activeItem.id));
            carouselCounterEl.textContent = `${activeIndex + 1} / ${filteredItems.length}`;
        }

        function updateHeroText(item) {
            document.getElementById('heroBadge').textContent = item.offerTag || item.category;
            document.getElementById('heroTitle').innerHTML = `${item.titleLines[0]}<br>${item.titleLines[1]}`;
            document.getElementById('heroDesc').textContent = `${item.subtitle} — freshly prepared and delivered directly to your cinema seat.`;
            document.getElementById('heroPrice').textContent = `₹${item.price}`;
            document.getElementById('heroStock').textContent = item.statusNote;
        }

        function selectItem(item) {
            if (isSwitching || item.id === activeItem.id) return;
            isSwitching = true;
            activeItem = item;

            document.querySelectorAll('.card').forEach(c => {
                c.classList.toggle('active', c.dataset.id === item.id);
            });
            const activeCard = document.querySelector(`.card[data-id="${item.id}"]`);
            if (activeCard) {
                activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
            const activeIndex = Math.max(0, filteredItems.findIndex(i => i.id === item.id));
            carouselCounterEl.textContent = `${activeIndex + 1} / ${filteredItems.length}`;

            // 1. Background gradient morph
            gsap.to(document.body, {
                '--bg-inner': item.theme.inner,
                '--bg-mid': item.theme.mid,
                '--bg-outer': item.theme.outer,
                duration: 1.4,
                ease: 'power2.inOut'
            });

            // 2. Center stage 720° spin + blur + swap at peak
            const targetStage = item.use3DCan ? modelViewer : foodStage3d;
            const spinObj = { val: 0, blur: 0 };
            gsap.to(spinObj, {
                val: 360,
                blur: 15,
                duration: 0.55,
                ease: 'power2.in',
                onUpdate: () => {
                    switchSpin = spinObj.val;
                    foodStage3d.style.filter = `blur(${spinObj.blur}px)`;
                    modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                },
                onComplete: () => {
                    updateHeroText(item);
                    if (item.use3DCan) {
                        foodStage3d.classList.add('hidden-3d');
                        modelViewer.classList.add('active-3d');
                        applyCanTexture(item);
                    } else {
                        modelViewer.classList.remove('active-3d');
                        foodStage3d.classList.remove('hidden-3d');
                        foodStageImg.src = item.image;
                        foodStageImg.alt = item.name;
                        foodStageImg.classList.toggle('can-mode', !!item.isCanShowcase);
                    }

                    gsap.to(spinObj, {
                        val: 720,
                        blur: 0,
                        duration: 1.35,
                        ease: 'back.out(0.7)',
                        onUpdate: () => {
                            switchSpin = spinObj.val;
                            foodStage3d.style.filter = `blur(${spinObj.blur}px)`;
                            modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                        },
                        onComplete: () => {
                            switchSpin = 0;
                            foodStage3d.style.filter = 'none';
                            modelViewer.style.filter = 'none';
                        }
                    });
                }
            });

            // 3. Floating Food Sprites / Berries Implode -> Swap -> Explode
            let completedBerries = 0;
            const targetGlb = item.berryMode === 'blueberry'
                ? 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb'
                : 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb';
            const spritePool = getFloatSpritesForItem(item);

            allBerries.forEach((berry, idx) => {
                const bW = berry.offsetWidth / 2;
                const bH = berry.offsetHeight / 2;
                const centerX = (window.innerWidth / 2 - berry.offsetLeft - bW);
                const centerY = (window.innerHeight / 2 - berry.offsetTop - bH);

                const startAngle = parseFloat(berry.dataset.angle) || 0;
                const currentBaseX = parseFloat(berry.dataset.baseX) || 0;
                const currentBaseY = parseFloat(berry.dataset.baseY) || 0;
                const nextBaseX = (Math.random() - 0.5) * 180;
                const nextBaseY = (Math.random() - 0.5) * 180;

                gsap.set(berry, { rotation: startAngle, x: currentBaseX, y: currentBaseY });

                gsap.timeline()
                    .to(berry, {
                        x: centerX,
                        y: centerY,
                        rotation: startAngle + 45,
                        scale: 0.1,
                        opacity: 0,
                        duration: 0.48,
                        ease: 'power2.in',
                        onComplete: () => {
                            applyFloatVisual(berry, item, idx, spritePool, targetGlb);
                        }
                    })
                    .to(berry, { duration: 0.25 })
                    .to(berry, {
                        x: nextBaseX,
                        y: nextBaseY,
                        rotation: startAngle + 90,
                        scale: 1,
                        opacity: 1,
                        duration: 0.85,
                        ease: 'back.out(1.5)',
                        onComplete: () => {
                            berry.dataset.angle = startAngle + 90;
                            berry.dataset.baseX = nextBaseX;
                            berry.dataset.baseY = nextBaseY;
                            berry.dataset.rx = 0;
                            berry.dataset.ry = 0;
                            completedBerries++;
                            if (completedBerries === allBerries.length) {
                                isSwitching = false;
                            }
                        }
                    });
            });
        }

        // Category Filter Navigation
        document.querySelectorAll('#categoryNav .nav-item').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#categoryNav .nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const cat = btn.dataset.cat;
                filteredItems = cat === 'ALL' ? [...FOOD_CATALOG] : FOOD_CATALOG.filter(i => i.category === cat);
                renderCarousel();
                if (filteredItems.length > 0 && !filteredItems.some(i => i.id === activeItem.id)) {
                    selectItem(filteredItems[0]);
                }
            });
        });

        // Carousel Prev / Next Arrows
        document.getElementById('prevFoodBtn').addEventListener('click', () => {
            const idx = filteredItems.findIndex(i => i.id === activeItem.id);
            const prev = (idx - 1 + filteredItems.length) % filteredItems.length;
            selectItem(filteredItems[prev]);
        });

        document.getElementById('nextFoodBtn').addEventListener('click', () => {
            const idx = filteredItems.findIndex(i => i.id === activeItem.id);
            const next = (idx + 1) % filteredItems.length;
            selectItem(filteredItems[next]);
        });

        // Init berry tracking
        allBerries.forEach(b => {
            b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
            b.dataset.baseX = 0; b.dataset.baseY = 0;
        });

        let mouse = { x: 0, y: 0, px: 0, py: 0 };
        let currentMouse = { x: 0, y: 0 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) - 0.5;
            mouse.y = (e.clientY / window.innerHeight) - 0.5;
            mouse.px = e.clientX;
            mouse.py = e.clientY;
        });

        function animate() {
            const time = Date.now() * 0.001;
            currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
            currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

            // Real-time 3D cursor tilt for both <model-viewer> (when not dragging 360) and Food Showcase Stage
            if (!isDragging3DCan || isSwitching) {
                modelViewer.cameraOrbit = `${(currentMouse.x * 40) + switchSpin}deg ${90 + (currentMouse.y * 20)}deg 380%`;
            }
            foodStage3d.style.transform = `rotateY(${(currentMouse.x * 34) + switchSpin}deg) rotateX(${currentMouse.y * -24}deg)`;

            berriesFG.style.transform = `translate(${currentMouse.x * 60}px, ${currentMouse.y * 60}px)`;
            berriesBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;
            leavesBG.style.transform = `translate(${currentMouse.x * -15}px, ${currentMouse.y * -15}px)`;

            if (!isSwitching) {
                allBerries.forEach((berry, i) => {
                    const berryRect = berry.getBoundingClientRect();
                    const berryX = berryRect.left + berryRect.width / 2;
                    const berryY = berryRect.top + berryRect.height / 2;

                    const diffX = mouse.px - berryX;
                    const diffY = mouse.py - berryY;
                    const distance = Math.sqrt(diffX * diffX + diffY * diffY);

                    let targetRx = 0, targetRy = 0, speedMult = 1;
                    if (distance < 400 && distance > 0) {
                        const force = (400 - distance) / 400;
                        targetRx = (diffX / distance) * force * -80;
                        targetRy = (diffY / distance) * force * -80;
                        speedMult = 1 + force * 5;
                    }

                    let rx = parseFloat(berry.dataset.rx) || 0;
                    let ry = parseFloat(berry.dataset.ry) || 0;
                    let angle = parseFloat(berry.dataset.angle) || 0;
                    let baseX = parseFloat(berry.dataset.baseX) || 0;
                    let baseY = parseFloat(berry.dataset.baseY) || 0;

                    rx += (targetRx - rx) * 0.1;
                    ry += (targetRy - ry) * 0.1;
                    angle += 0.2 * speedMult;

                    berry.dataset.rx = rx;
                    berry.dataset.ry = ry;
                    berry.dataset.angle = angle;

                    const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
                    const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
                    const floatY = Math.sin(phase) * 15;
                    const floatAngle = Math.cos(phase) * 6;

                    berry.style.transform = `translate(calc(${rx + baseX}px), calc(${ry + baseY}px + ${floatY}px)) rotate(calc(${angle}deg + ${floatAngle}deg))`;
                });
            }

            document.querySelectorAll('.leaf').forEach((leaf, i) => {
                const dur = 10 + i * 2;
                const phase = (time + i * 1.2) * (Math.PI * 2 / dur);
                const floatY = Math.sin(phase) * 20;
                const floatX = Math.cos(phase * 0.5) * 15;
                const floatAngle = Math.sin(phase * 0.3) * 15;
                leaf.style.transform = `translate(${floatX}px, ${floatY}px) rotate(${floatAngle}deg)`;
            });

            requestAnimationFrame(animate);
        }

        // Bubbles
        const bubblesContainer = document.getElementById('bubbles-container');
        function createBubble() {
            if (!bubblesContainer) return;
            const bubble = document.createElement('img');
            bubble.src = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/bubble.png';
            bubble.className = 'bubble-img';
            bubble.style.width = (Math.random() * 20 + 10) + 'px';
            bubble.style.height = 'auto';
            bubble.style.left = Math.random() * 100 + '%';
            bubble.style.bottom = '-50px';
            bubble.style.opacity = Math.random() * 0.4 + 0.2;
            const duration = Math.random() * 6 + 4;
            bubble.style.animation = `floatUpImg ${duration}s linear forwards`;
            bubblesContainer.appendChild(bubble);
            setTimeout(() => bubble.remove(), duration * 1000);
        }
        setInterval(createBubble, 400);

        // Cart & Seat Delivery Modal
        const orderModal = document.getElementById('orderModal');
        const cartListEl = document.getElementById('cartList');
        const cartCountBadge = document.getElementById('cartCountBadge');
        const submitOrderBtn = document.getElementById('submitOrderBtn');

        function renderCart() {
            const totalQty = cart.reduce((sum, c) => sum + c.qty, 0);
            const totalAmt = cart.reduce((sum, c) => sum + (c.price * c.qty), 0);
            cartCountBadge.textContent = totalQty;
            submitOrderBtn.textContent = `Place Seat Order (₹${totalAmt})`;

            if (cart.length === 0) {
                cartListEl.innerHTML = `<div style="text-align:center;color:rgba(255,255,255,0.6);font-size:0.85rem;padding:0.8rem 0;">Cart is empty. Click "Add to Seat Order" on any item!</div>`;
                return;
            }
            cartListEl.innerHTML = cart.map((c, idx) => `
                <div class="cart-row">
                    <div>
                        <div style="font-weight:700;">${c.name}</div>
                        <div style="font-size:0.75rem;color:#fbcfe8;">₹${c.price} × ${c.qty} = ₹${c.price * c.qty}</div>
                    </div>
                    <div class="cart-qty-btns">
                        <button type="button" class="qty-btn" onclick="updateCartQty(${idx}, -1)">-</button>
                        <span>${c.qty}</span>
                        <button type="button" class="qty-btn" onclick="updateCartQty(${idx}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        window.updateCartQty = function(idx, delta) {
            cart[idx].qty += delta;
            if (cart[idx].qty <= 0) cart.splice(idx, 1);
            renderCart();
        };

        document.getElementById('addToCartHeroBtn').addEventListener('click', () => {
            const existing = cart.find(c => c.id === activeItem.id);
            if (existing) existing.qty += 1;
            else cart.push({ id: activeItem.id, name: activeItem.name, price: activeItem.price, qty: 1 });
            renderCart();
            orderModal.classList.add('open');
            document.getElementById('orderStatus').textContent = '';
        });

        document.getElementById('openOrderModalTop').addEventListener('click', () => {
            renderCart();
            orderModal.classList.add('open');
            document.getElementById('orderStatus').textContent = '';
        });

        document.getElementById('closeOrderModal').addEventListener('click', () => orderModal.classList.remove('open'));
        orderModal.addEventListener('click', (e) => {
            if (e.target === orderModal) orderModal.classList.remove('open');
        });

        document.getElementById('seatOrderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (cart.length === 0) {
                document.getElementById('orderStatus').textContent = 'Please add at least 1 food item first!';
                return;
            }
            const tableOrSeat = document.getElementById('orderSeat').value.trim();
            const customerName = (document.getElementById('orderGuest')?.value || '').trim() || 'QR Guest';
            const statusEl = document.getElementById('orderStatus');
            const submitBtn = document.getElementById('submitOrderBtn');
            submitBtn.disabled = true;
            statusEl.textContent = 'Sending order to Kitchen...';
            try {
                const res = await fetch('/api/food-orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tableOrSeat, customerName, items: cart })
                });
                const data = await res.json();
                if (data && data.ok) {
                    statusEl.textContent = `✓ ${data.order.kotId} sent to Kitchen for ${tableOrSeat} (₹${data.order.totalAmt})!`;
                    cart = [];
                    renderCart();
                } else {
                    statusEl.textContent = (data && data.error) || 'Could not send order. Please try again.';
                }
            } catch (err) {
                statusEl.textContent = 'Network error sending order to Kitchen.';
            } finally {
                submitBtn.disabled = false;
            }
        });

        function getFloatSpritesForItem(item) {
            const id = item.id;
            if (id === 'p1') return ['/assets/food-floats/popcorn.png', '/assets/food-floats/ice-cube.png', '/assets/food-floats/water-splash.png'];
            if (id === 'p2') return ['/assets/food-floats/samosa.png'];
            if (id === 'p3' || id === 'p5') return ['/assets/food-floats/popcorn.png'];
            if (id === 'p4') return ['/assets/food-floats/nacho.png'];
            if (id === 'p6' || id === 'p8') return ['/assets/food-floats/samosa.png'];
            if (id === 'p7') return ['__GLB__', '/assets/food-floats/water-splash.png', '/assets/food-floats/ice-cube.png'];
            if (id === 'p9') return ['/assets/food-floats/brownie.png'];
            if (id === 'p10') return ['/assets/food-floats/popcorn.png', '/assets/food-floats/nacho.png', '/assets/food-floats/water-splash.png'];
            if (id === 'p11') return ['/assets/food-floats/nacho.png', '/assets/food-floats/brownie.png'];
            if (id === 'p12') return ['/assets/food-floats/water-splash.png', '/assets/food-floats/ice-cube.png', '__GLB__'];
            if (id === 'p13') return ['/assets/food-floats/lime-slice.png', '/assets/food-floats/water-splash.png', '/assets/food-floats/ice-cube.png'];
            if (id === 'p14') return ['/assets/food-floats/orange-slice.png', '/assets/food-floats/water-splash.png', '/assets/food-floats/ice-cube.png'];
            if (id === 'p15') return ['/assets/food-floats/coffee-bean.png', '/assets/food-floats/water-splash.png', '/assets/food-floats/ice-cube.png'];
            return ['/assets/food-floats/popcorn.png'];
        }

        function applyFloatVisual(berry, item, idx, spritePool, targetGlb) {
            const img = berry.querySelector('.float-sprite');
            const glb = berry.querySelector('.float-glb');
            const choice = spritePool[idx % spritePool.length];
            if (choice === '__GLB__') {
                berry.classList.add('is-glb');
                if (glb && glb.src !== targetGlb) glb.src = targetGlb;
            } else {
                berry.classList.remove('is-glb');
                if (img && choice) img.src = choice;
            }
        }

        // Boot
        const initPool = getFloatSpritesForItem(activeItem);
        allBerries.forEach((berry, idx) => applyFloatVisual(berry, activeItem, idx, initPool, 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb'));
        renderCarousel();
        updateHeroText(activeItem);
        renderCart();
        animate();
    </script>
</body>
</html>
